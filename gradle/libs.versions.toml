[versions]
krossbow = "9.3.0"
agp = "9.2.1"
kotlin = "2.2.10"
coreKtx = "1.19.0"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
navigationCompose = "2.9.8"
lifecycle = "2.11.0"
retrofit = "3.0.0"
okhttp = "5.1.0"
# 3.3.0 고정. 상향 금지 — 3.6.3 은 kotlin-stdlib 2.4.10 을 끌어와 메타데이터 2.4.0 이 되고,
# 컴파일러 2.2.10 이 읽을 수 있는 상한(2.3.0)을 넘겨 `:presentation:compileDebugKotlin` 이
# "Module was compiled with an incompatible version of Kotlin" 으로 **실패한다**(실측).
# 덤으로 3.6.3 은 androidx.compose foundation/ui/runtime 을 1.12.0 으로 밀어올려 Compose BOM 이
# 버전 통제를 잃는다(material3 만 BOM 의 1.4.0 에 남는다). 3.3.0 은 Compose 드리프트가 0 이다.
# Kotlin 을 올리는 날 이 핀도 같이 재검토할 것.
coil = "3.3.0"
kotlinxSerialization = "1.9.0"
kotlinxCoroutines = "1.10.2"
datastore = "1.1.7"
desugarJdkLibs = "2.1.5"
googleServices = "4.5.0"
# Crashlytics Gradle 플러그인. 라이브러리와 달리 **BOM 이 관리하지 않아** 버전을 직접 적는다.
# 3.0.8 은 2026-11-01 Google Maven(dl.google.com/dl/android/maven2) maven-metadata.xml 의 latest 실측값이다.
crashlyticsPlugin = "3.0.8"
naverMapSdk = "3.23.3"
playServicesLocation = "21.4.0"
firebaseBom = "34.17.0"
# 2026-11-04 기준 Maven Central 최신 안정판(2026-10-30 배포)
mixpanel = "8.12.0"
# Meta(Facebook) 광고 설치 측정. 2026-11-04 Maven Central 배포. kotlin-stdlib 1.8.20 을 끌고 와 Kotlin 2.2.10 과 충돌하지 않는다(pom 확인).
facebookSdk = "19.0.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

[libraries]
krossbow-stomp-core = { group = "org.hildan.krossbow", name = "krossbow-stomp-core", version.ref = "krossbow" }
krossbow-websocket-okhttp = { group = "org.hildan.krossbow", name = "krossbow-websocket-okhttp", version.ref = "krossbow" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
naver-map-sdk = { group = "com.naver.maps", name = "map-sdk", version.ref = "naverMapSdk" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
# app 이 이미지 로더에 OkHttpClient 를 넘기므로 app 의 **컴파일** 클래스패스에도 필요하다.
# data 는 okhttp 를 implementation 으로 쓰고 coil-network-okhttp 는 4.12.0 을 끌고 오므로,
# 명시하지 않으면 app 이 4.12.0 헤더로 컴파일되고 런타임만 5.1.0 이 되는 어긋남이 생긴다.
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okhttp-sse = { group = "com.squareup.okhttp3", name = "okhttp-sse", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }
# 버전을 적지 않는다 — BOM 34.17.0 이 firebase-crashlytics 20.1.0 으로 고정한다(BOM pom 실측).
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
mixpanel-android = { group = "com.mixpanel.android", name = "mixpanel-android", version.ref = "mixpanel" }
# facebook-android-sdk 전체가 아니라 core 만 — 로그인·공유 없이 앱 이벤트(설치 측정)만 쓴다.
facebook-core = { group = "com.facebook.android", name = "facebook-core", version.ref = "facebookSdk" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlyticsPlugin" }
