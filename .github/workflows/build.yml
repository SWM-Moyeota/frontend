name: 빌드 테스트

on:
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'presentation/**'
      - 'domain/**'
      - 'data/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/build.yml'
  # develop 머지마다 한 번 돌려 Gradle 캐시를 **저장**한다 — setup-gradle 은 기본 브랜치에서만 캐시를 쓰고(write)
  # PR 브랜치는 읽기만 한다. pull_request 만 걸려 있으면 캐시가 영영 안 생겨 모든 PR 빌드가 콜드다(매번 ~4분).
  push:
    branches: [develop]
    paths:
      - 'app/**'
      - 'core/**'
      - 'presentation/**'
      - 'domain/**'
      - 'data/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# 같은 PR 에 새 푸시가 오면 이전 실행은 취소한다 — 러너 큐에 낡은 빌드가 줄 서서 결과가 늦어지는 걸 막는다
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 빌드 및 테스트
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        # v6 기본값(cache-cleanup: on-success)이 빌드 성공 시 안 쓰는 캐시 항목을 정리해 10GB 한도를 넘지 않게 한다
        uses: gradle/actions/setup-gradle@v6

      # org.gradle.caching(gradle.properties)으로 태스크 출력도 캐시된다 — 바뀌지 않은 모듈(domain·core·data)의
      # 컴파일은 캐시에서 꺼내 온다. 캐시 디렉터리는 setup-gradle 이 Gradle User Home 과 함께 보존한다.
      - name: Build and test
        env:
          NAVER_MAPS_CLIENT_ID: ${{ secrets.NAVER_MAPS_CLIENT_ID }}
        run: ./gradlew :app:assembleDebug :data:testDebugUnitTest :presentation:testDebugUnitTest --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            data/build/reports/tests/testDebugUnitTest
            presentation/build/reports/tests/testDebugUnitTest
          retention-days: 7
