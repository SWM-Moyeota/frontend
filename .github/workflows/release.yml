name: Create Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  id-token: write

jobs:
  calculate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        uses: ./.github/actions/calculate-version

  build-apk:
    needs: [ calculate-version ]
    runs-on: ubuntu-latest

    steps:
      - name: Repository 접근
        uses: actions/checkout@v7

      - name: JDK 25 셋팅
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 릴리즈 서명 키가 아직 없어 debug APK를 산출물로 첨부한다.
      # 서명 설정 후 assembleRelease로 교체할 것.
      - name: APK 빌드
        run: |
          ./gradlew :app:assembleDebug --no-daemon --build-cache
          cp app/build/outputs/apk/debug/app-debug.apk \
             "moyeota-v${{ needs.calculate-version.outputs.version }}.apk"

      - name: APK 업로드
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: moyeota-v${{ needs.calculate-version.outputs.version }}.apk
          retention-days: 7

  release:
    needs: [ calculate-version, build-apk ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: APK 다운로드
        uses: actions/download-artifact@v8
        with:
          name: apk

      - name: Create GitHub Release
        run: |
          gh release create "v${{ needs.calculate-version.outputs.version }}" \
            --generate-notes \
            "moyeota-v${{ needs.calculate-version.outputs.version }}.apk"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
